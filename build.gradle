plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = 'com.hack337'
version = '0.5.0-forge'
base { archivesName = 'OmniIsle-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { omniisle { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { omniisle { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
jar {
    manifest { attributes 'MixinConfigs': 'omniisle.client.mixins.json' }
    finalizedBy 'reobfJar'
}
