name: Compile native OmniIsle Forge 1.20.1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original worldgen data
        run: python3 tools/restore_worldgen.py
      - name: Compile Forge port
        run: gradle --no-daemon --stacktrace build
      - name: Upload development JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: omniisle-forge-1.20.1-development-jar
          path: build/libs/*.jar
