name: Build native Forge 1.20.1
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch exact upstream sources
        run: |
          git clone --depth 1 --branch neoforge/1.21.1 https://github.com/y9hack337/OmniIsle.git /tmp/omni-neo
          git -C /tmp/omni-neo fetch --depth 1 origin 051aba887c0c05346b8cbe6eab0e5434d6503b9c
          git -C /tmp/omni-neo -c advice.detachedHead=false checkout --detach 051aba887c0c05346b8cbe6eab0e5434d6503b9c
          test "$(git -C /tmp/omni-neo rev-parse HEAD)" = 051aba887c0c05346b8cbe6eab0e5434d6503b9c
          git clone --depth 1 --branch fabric/1.20.1 https://github.com/y9hack337/OmniIsle.git /tmp/omni-fabric
          git -C /tmp/omni-fabric fetch --depth 1 origin 5f4b5bf94761d640f5351ca90cb6825c6e9f6dac
          git -C /tmp/omni-fabric -c advice.detachedHead=false checkout --detach 5f4b5bf94761d640f5351ca90cb6825c6e9f6dac
          test "$(git -C /tmp/omni-fabric rev-parse HEAD)" = 5f4b5bf94761d640f5351ca90cb6825c6e9f6dac
          mkdir -p src/main/java src/main/resources
          cp -R /tmp/omni-neo/src/main/java/. src/main/java/
          cp -R /tmp/omni-fabric/src/main/resources/. src/main/resources/
          test -f src/main/java/com/hack337/omniisle/OmniIsleIds.java
          rm -f src/main/resources/fabric.mod.json
          rm -f src/main/resources/META-INF/neoforge.mods.toml
      - name: Restore SHA-256 verified Minecraft 1.20.1 release worldgen assets
        run: python3 tools/restore_worldgen.py
      - name: Convert to native Forge 1.20.1
        run: python3 scripts/convert.py
      - name: Compile and reobfuscate
        run: gradle build --stacktrace --console=plain --no-daemon
      - name: Upload Forge mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OmniIsle-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Validate packaged resources
        run: |
          python3 - <<'PY'
          import json,zipfile,glob
          jar=glob.glob("build/libs/*.jar")[0]
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              required=["META-INF/mods.toml","omniisle.client.mixins.json",
                "data/omniisle/worldgen/world_preset/omniisle.json",
                "data/omniisle/worldgen/noise_settings/omni_terrain.json",
                "com/hack337/omniisle/OmniIsleMod.class",
                "com/hack337/omniisle/client/OmniIsleEditorScreen.class",
                "omniisle.refmap.json"]
              for p in required: assert p in names, "Missing "+p
              assert "fabric.mod.json" not in names
              assert "com/hack337/omniisle/mixin/client/StructureLandGuardMixin.class" in names
              land_tag = "data/omniisle/tags/worldgen/structure/land_only.json"
              assert land_tag in names
              entries = json.loads(z.read(land_tag))["values"]
              guarded = {entry["id"] for entry in entries}
              assert {"iceandfire:fire_dragon_cave", "iceandfire:ice_dragon_cave",
                      "iceandfire:lightning_dragon_cave", "iceandfire:fire_dragon_roost"}.issubset(guarded)
              assert "iceandfire:siren_island" not in guarded
              assert all(entry["required"] is False for entry in entries)
              assert "StructureLandGuardMixin" in json.loads(z.read("omniisle.client.mixins.json")).get("mixins", [])
              config=json.loads(z.read("omniisle.client.mixins.json"))
              assert config["compatibilityLevel"]=="JAVA_17"
              assert config["refmap"]=="omniisle.refmap.json"
              assert "WorldTypeEditorMixin" not in config.get("client", [])
              for p in names:
                  if p.endswith(".json"): json.loads(z.read(p))
          print("Validated Forge JAR and all JSON data resources:",jar)
          PY
      - name: Start dedicated Forge server with OmniIsle preset
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'level-type=omniisle:omniisle\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=-1\n' > run/server.properties
          set +e
          timeout 180s gradle runServer --console=plain --no-daemon > server-smoke.log 2>&1 &
          pid=$!
          started=0
          for n in $(seq 1 90); do
            if grep -Eq 'Done \([0-9.]' server-smoke.log; then started=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          set -e
          tail -n 140 server-smoke.log
          if [ "$started" != "1" ]; then echo 'OmniIsle dedicated server did not start successfully'; exit 1; fi
          if grep -E 'Failed to load|Exception loading level|Errors in currently selected datapacks' server-smoke.log; then exit 1; fi
          echo 'Dedicated server started with OmniIsle world preset'
      - name: Upload server verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniIsle-Forge-Server-Verification
          path: server-smoke.log
          if-no-files-found: ignore
      - name: Launch client and render original island editor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          cat > src/main/java/com/hack337/omniisle/ClientSmokeHarness.java <<'JAVA'
          package com.hack337.omniisle;
          import com.hack337.omniisle.client.OmniIsleEditorScreen;
          import com.hack337.omniisle.client.WorldPackBuilder;
          import com.hack337.omniisle.client.IslandDraft;
          import java.nio.file.Path;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.worldselection.WorldCreationUiState;
          import java.util.stream.Stream;
          import net.minecraft.client.gui.screens.TitleScreen;
          import net.minecraft.client.gui.screens.worldselection.CreateWorldScreen;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          public final class ClientSmokeHarness {
              private static int phase = 0, rendered = 0, ticks = 0;
              @SubscribeEvent public static void onTick(TickEvent.ClientTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) return;
                  Minecraft mc = Minecraft.getInstance();
                  if (++ticks % 100 == 0) System.out.println("OMNI_SMOKE_TICK " + ticks + " screen=" + (mc.screen == null ? "null" : mc.screen.getClass().getSimpleName()));
                  if (phase == 0 && mc.screen != null && (mc.screen instanceof TitleScreen || mc.screen.getClass().getSimpleName().equals("AccessibilityOnboardingScreen"))) {
                      phase=1;
                      CreateWorldScreen.openFresh(mc, mc.screen);
                      System.out.println("OMNI_SMOKE_CREATE_WORLD_OPEN");
                  } else if (phase == 1 && mc.screen instanceof CreateWorldScreen worldScreen) {
                      var state = worldScreen.getUiState();
                      var choice = Stream.concat(state.getNormalPresetList().stream(), state.getAltPresetList().stream())
                          .filter(e -> e.preset() != null && e.preset().unwrapKey()
                              .map(k -> "omniisle".equals(k.location().getNamespace()) && "omniisle".equals(k.location().getPath())).orElse(false))
                          .findFirst();
                      if (choice.isPresent()) {
                          state.setWorldType(choice.get());
                          phase=2;
                          System.out.println("OMNI_SMOKE_PRESET_SELECTED");
                      }
                  } else if (phase == 2 && mc.screen instanceof CreateWorldScreen worldScreen) {
                      for (var child : worldScreen.children()) {
                          if (child instanceof Button button
                              && button.visible && button.active
                              && button.getMessage().getString().toLowerCase(java.util.Locale.ROOT).contains("omniisle")) {
                              phase=3;
                              button.onPress();
                              System.out.println("OMNI_SMOKE_EDITOR_BUTTON_CLICKED");
                              break;
                          }
                      }
                  } else if (phase == 3 && mc.screen instanceof OmniIsleEditorScreen) {
                      if (++rendered >= 60) {
                          phase=4;
                          System.out.println("OMNI_SMOKE_EDITOR_RENDERED");
                          try {
                              net.minecraft.client.Screenshot.grab(mc.gameDirectory, "omniisle-editor.png",
                                  mc.getMainRenderTarget(), msg -> System.out.println("OMNI_SMOKE_SCREENSHOT " + msg.getString()));
                          } catch (Exception screenshotError) {
                              System.out.println("OMNI_SMOKE_SCREENSHOT_FAILED");
                              screenshotError.printStackTrace();
                          }
                          try {
                              WorldPackBuilder.export(Path.of("omni-smoke-datapacks"), new IslandDraft());
                              System.out.println("OMNI_SMOKE_ISLAND_DATAPACK_EXPORTED");
                          } catch (Exception e) {
                              System.out.println("OMNI_SMOKE_EXPORT_FAILED");
                              e.printStackTrace();
                          }
                      }
                  }
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/hack337/omniisle/OmniIsleMod.java')
          s=p.read_text()
          k='MinecraftForge.EVENT_BUS.addListener(OmniCommands::registerCommands);'
          assert k in s
          p.write_text(s.replace(k,k+' MinecraftForge.EVENT_BUS.addListener(ClientSmokeHarness::onTick);'))
          PY
          set +e
          timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' gradle runClient --console=plain --no-daemon > client-smoke.log 2>&1 &
          client_pid=$!
          passed=0
          for n in $(seq 1 90); do
            if grep -q 'OMNI_SMOKE_ISLAND_DATAPACK_EXPORTED' client-smoke.log && test -s run/screenshots/omniisle-editor.png; then passed=1; break; fi
            if ! kill -0 "$client_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          kill "$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true
          rm -f src/main/java/com/hack337/omniisle/ClientSmokeHarness.java
          set -e
          tail -n 140 client-smoke.log
          if [ "$passed" != "1" ]; then echo 'World creation editor did not finish loading'; exit 1; fi
          if grep -E 'MixinApplyError|InvalidInjectionException|Failed to apply mixin|OMNI_SMOKE_EXPORT_FAILED|OMNI_SMOKE_SCREENSHOT_FAILED' client-smoke.log; then exit 1; fi
          test -s run/screenshots/omniisle-editor.png
          python3 - <<'PY'
          import json,zipfile
          p='run/omni-smoke-datapacks/omniisle-generated.zip'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert 'pack.mcmeta' in names
              data=json.loads(z.read('pack.mcmeta'))
              assert data['pack']['pack_format']==15, data
              assert 'data/omniisle/worldgen/density_function/overworld/continents.json' in names
              assert 'data/omniisle/worldgen/world_preset/omniisle.json' in names
              assert any(n.startswith('data/minecraft/worldgen/structure_set/') for n in names)
              print('OmniIsle editor export datapack verified:', len(names), 'files')
          PY
          # Undo the temporary test hook before publishing the source archive.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/hack337/omniisle/OmniIsleMod.java')
          source = path.read_text()
          hook = ' MinecraftForge.EVENT_BUS.addListener(ClientSmokeHarness::onTick);'
          assert source.count(hook) == 1, 'Cannot restore production entry point'
          path.write_text(source.replace(hook, ''))
          assert not any('ClientSmokeHarness' in p.read_text() for p in Path('src/main/java').rglob('*.java'))
          PY
          echo 'Native Forge client successfully opened and rendered the island editor'
      - name: Upload client validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniIsle-Forge-Client-Verification
          path: |
            client-smoke.log
            run/screenshots/omniisle-editor.png
          if-no-files-found: ignore
      - name: Install production Forge server and load release JAR
        run: |
          mkdir -p prod-server/mods
          cp build/libs/OmniIsle-Forge-1.20.1-0.5.0-forge.jar prod-server/mods/
          curl -fSL --retry 3 --connect-timeout 30 \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar \
            -o prod-server/forge-installer.jar
          (cd prod-server && java -jar forge-installer.jar --installServer) > prod-installer.log 2>&1
          test -f prod-server/run.sh
          printf 'eula=true\n' > prod-server/eula.txt
          printf 'level-type=omniisle:omniisle\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=-1\n' > prod-server/server.properties
          (
            cd prod-server
            timeout 240s bash ./run.sh nogui > ../prod-server.log 2>&1
          ) &
          pid=$!
          ready=0
          for n in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]' prod-server.log 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          tail -n 120 prod-server.log
          if [ "$ready" != "1" ]; then echo 'Installed Forge server failed to load native release JAR'; exit 1; fi
          if grep -E 'Failed to load|Exception loading level|Errors in currently selected datapacks' prod-server.log; then exit 1; fi
          echo "Production Forge 1.20.1 server loaded release JAR and generated OmniIsle"
      - name: Upload production server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniIsle-Forge-Installed-Server-Verification
          path: |
            prod-installer.log
            prod-server.log
          if-no-files-found: ignore
      - name: Upload reproducible full source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OmniIsle-Forge-1.20.1-Source
          path: |
            build.gradle
            settings.gradle
            gradle.properties
            LICENSE
            src/main/java
            src/main/resources
            scripts/convert.py
      - name: Upload project sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OmniIsle-Forge-Debug-Source
          path: |
            src/main/java
            src/main/resources
          retention-days: 7
